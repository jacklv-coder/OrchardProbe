name: DemoLab

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    DEMO_LAB_APP_BUNDLE_ID: com.example.orchardprobe.demolab
    DEMO_LAB_APP_GROUP_ID: group.com.example.orchardprobe.demolab
    DEMO_LAB_BUILD_BINDING_SHA256: ""
    DEMO_LAB_FRAMEWORK_BUNDLE_ID: com.example.orchardprobe.demolab.framework
    DEMO_LAB_IDENTITY_NONCE: ""
    DEMO_LAB_KEYCHAIN_ACCESS_GROUP: $(PRODUCT_BUNDLE_IDENTIFIER)
    DEMO_LAB_OBSERVER_REVISION: lab002-observer-v1
    DEMO_LAB_SHARE_BUNDLE_ID: com.example.orchardprobe.demolab.share
    DEMO_LAB_SOURCE_COMMIT: ""
    ENABLE_DEBUG_DYLIB: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "5.0"

targets:
  DemoFramework:
    type: framework
    platform: iOS
    sources:
      - path: Framework/Sources
      - path: Shared/Sources/LAB002MachOObserverCore.swift
      - path: Shared/Sources/LAB002LiveMachOObserver.swift
      - path: Framework/Headers
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DEMO_LAB_FRAMEWORK_BUNDLE_ID)
        PRODUCT_NAME: DemoFramework
        INFOPLIST_FILE: Framework/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES

  DemoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension/Sources
      - path: Shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DEMO_LAB_SHARE_BUNDLE_ID)
        PRODUCT_NAME: DemoShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: ShareExtension/Sources/OracleRange.h
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: ShareExtension/DemoShareExtension.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  DemoLab:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared/Sources
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: DemoFramework
        embed: true
      - target: DemoShareExtension
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/DemoLab.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(DEMO_LAB_APP_BUNDLE_ID)
        PRODUCT_NAME: DemoLab
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/OracleRange.h
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  DemoLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DemoLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.orchardprobe.demolab.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DemoLab:
    build:
      targets:
        DemoLab: all
    test:
      targets:
        - DemoLabTests
